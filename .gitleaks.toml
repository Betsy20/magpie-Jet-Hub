# gitleaks 配置 —— 本仓口径。
#
# ⚠️ 为什么必须自定义规则（2026-11-12 实测）：
#   把本次事故的两个部署脚本单独丢给 gitleaks 默认规则，结果是 **0 命中**。
#   默认规则认的是「云厂商 key 形状」（AKIA…、ghp_…、高熵 base64），而这次
#   泄露的是：
#     · `PROBE_WEB_KEY="<18 位数字>"` —— 18 位**纯数字**，熵极低；
#     · `REMOTE_HOST="<生产机 IP>"` —— 一个 IP；
#     · `REMOTE_USER="root"` —— 一个用户名；
#     · `SSH_KEY="<某台机器上的私钥绝对路径>"` —— 一个路径。
#   也就是说：**默认规则对这次事故完全无效**。只挂 workflow 而不管规则，
#   等于装了个不响的报警器。所以下面写了 2 条本仓专用规则。
#
# 实现注意：gitleaks 走 RE2，**不支持后向断言**（`(?<!…)` 会让进程 panic）。
#   所以「前面不能是数字/点」用前导字符类 `[^0-9./]` + `secretGroup` 表达，
#   不要改回 lookbehind。
#
# 豁免只有一条：`vendor/`。
#   它是被代理产品（jet-hub 本体）的原样拷贝，它的 appId / appKey /
#   accessKeySecret 是那些客户端里本来就硬编码的**静态认证参数** —— 插件要能
#   工作就必须带着。改 vendor 任何字节都会让 `tests/t-vendor-patches.mjs` 与
#   `scripts/verify-vendor.mjs` 的指纹对不上（那两条守的正是「与上游逐字节一致」）。
#   它们属于上游，不属于本仓作者的运维环境；当成本仓泄露处理只会让扫描长期飘红，
#   最后被人 `|| true` 掉 —— 那比不扫更糟。
#
# 不要为了「先让 CI 绿」给 deploy 脚本开白名单：那两个文件已从仓库删除，
# 历史里的副本只能靠清史处理（见 docs/security-incident-20261112.md）。
[allowlist]
paths = ['''vendor/.*''']

# ── ① 硬编码的面板 key ────────────────────────────────────────────────────────
# ⚠ **不要只按这一次的样本写规则**（2026-11-12 三审 P1）：magpie 自己的提示是
#   `MAGPIE_WEB_KEY takes letters, digits and - . _ ~ only (openssl rand -hex 16 makes one)`
#   —— 合法 key 有两种形态：18 位纯数字（这次事故）与 32 位 hex（官方建议）。
#   只写 `\d{18}` 的话，运维按官方建议换成 hex key 之后，这条规则**永久抓不到**
#   它的泄露，而且失败是静默的（规则不报 ≠ 没泄露）。
# 只认两种**真的写死**的形态：赋值、URL 里的 `?k=` 参数；占位符 `<…>` / `${VAR}` 不命中。
[[rules]]
id = 'magpie-web-key-hardcoded'
description = '硬编码的 magpie web 面板 key（18 位纯数字 或 32+ 位 hex，必须走 MAGPIE_WEB_KEY 环境变量）'
# ⚠ 只留**一个**捕获组（2026-11-12 三审 P2 实测）：原写法两个分支各带一个组，
#   而 `secretGroup = 1` 只取第一组 ⇒ `?k=` 形态的 `Secret` 恒为空、
#   `--redact` 输出退化成一串 `REDACTED`（不可读）。把「赋值」与「?k=」收进
#   非捕获前缀，值统一落到第 1 组。
regex = '''(?i)(?:(?:PROBE_WEB_KEY|MAGPIE_WEB_KEY)\s*=\s*[\x60'"]|\?k=)(\d{18}|[A-Za-z0-9._~-]{32,})'''
secretGroup = 1
entropy = 0
keywords = ['web_key', '?k=']

# ── ② 生产主机的部署坐标 ─────────────────────────────────────────────────────
# 「钥放在哪 / 用什么账号 / 装在哪」三件套，任一件单独出现都算。
[[rules]]
id = 'deploy-host-coordinates'
description = '部署坐标（私钥路径 / root 登录 / 生产绝对路径）'
# RE2 没有否定前瞻（`(?!…)` 会让 gitleaks panic），所以「只认具体钥文件名」
# 换个写法：先粗匹配，再用 [allowlist.rules] 放掉 config / known_hosts。
# ⚠ 必须含 `/root/`（2026-11-12 三审 P1）：事故里泄露的就是 `root@<IP>` 的登录方式，
#   原正则只认 `~` / `/mnt/workspace` / `/home/<user>` —— `/root/.ssh/<钥名>` 漏报。
# ⚠ 实例根目录**不能要求尾斜杠**（三审 P2）：真实脚本里写的是
#   `HOME=<实例根>/home`（后面是空格），要求尾斜杠就一个都命不中。
#
# ⚠ 注释里**也不能写完整路径** —— `t-repo-purity.mjs` 的 `env-path` 规则会扫到本文件
#   （2026-11-12 实测：写了真路径就让它红了 2 处）。要么写成 `<实例根>`，要么
#   像下面正则那样用 `[\/]` 字符类转义。
#
# ⚠ 不再匹配裸的 `/opt/magpie`（2026-11-13 实测）：那是**产品默认安装路径**，
#   不是任何一台机器的坐标 —— magpie 自己就装在这，模板默认值、文档说明、
#   甚至本文件之外的所有正常引用都会写它。把它算违规的结果是 CI 恒红：
#     · `scripts/deploy-plugin.sh.example:58` `MAGPIE_HOME:-<实例根>`（模板默认值）
#     · `CHANGELOG.md:102` 「`/opt/magpie` 里 8 个社区登录插件全这么写」（说明文字）
#   这两个都不是秘密，却让 `tree` job 每次都失败 —— 长期红等于没有检查。
#   真坐标仍然抓得住：实例根目录 + 它的子目录（如 `<实例根>/home`、`<实例根>/config`），
#   以及 `.ssh/<钥名>` / 远程登录账号（`root`） 这两类。
regex = '''(?i)(?:(?:~|/mnt/workspace|/home/[A-Za-z0-9._-]+|/root)/\.ssh/[A-Za-z0-9._-]+|REMOTE_USER\s*=\s*[\x60'"]root[\x60'"]|[\/]opt[\/]magpie[\/](?:home|config|cache|tls|plugins))'''
entropy = 0
keywords = ['.ssh/', 'REMOTE_USER', 'magpie/']

# 规则 ② 的放行项：`~/.ssh/config` / `known_hosts` 是通用文件，不指向任何钥，
# 算违规只会让正常文档乱响然后被 `|| true` 掉。
# 注意 TOML 语义：`[rules.allowlist]` 作用于**上面最近那条** `[[rules]]`。
[rules.allowlist]
regexes = [
  '''/\.ssh/config$''',
  '''/\.ssh/known_hosts$''',
  # 模板里的**默认安装路径**：`MAGPIE_HOME="${MAGPIE_HOME:-/opt/magpie}"`。
  # 只放行这一行（`${VAR:-默认值}` 形态），模板里若有人填真实坐标照样会红。
  '''MAGPIE_HOME="\$\{MAGPIE_HOME:-/opt/magpie\}"''',
]
