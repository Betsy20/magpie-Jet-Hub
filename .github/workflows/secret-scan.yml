name: secret-scan

# 第二道防线：即便有人绕过 `t-repo-purity.mjs` 往仓库里塞凭据，这里也要红。
#
# 为什么需要它（2026-11-12 真实事故）：
#   `scripts/deploy-plugin-hcss*.sh` 把 magpie web 面板的 18 位明文 key、两台生产
#   服务器的公网 IP + root 账号、服务器上的私钥路径一起提交进了这个 public 仓库
#   （提交 `9003611` / `4fb5459`）。当时 CI 只有「离线单测 + 打包预演」两档，
#   对凭据零检查；等维护者人工审查发现时，`.patch` 已经能被匿名下载两天了。
#
# ── 与 `t-repo-purity.mjs` 的分工 ────────────────────────────────────────────
#   · 单测那条是**本仓自定的口径**（连服务器地址、主机别名、生产路径都算违规），
#     但它只扫工作区当前内容，扫不到历史。
#   · 这里用 gitleaks 扫 **完整 git 历史**，认的是通用凭据形状（云厂商 key、
#     PEM、token 前缀）+ 本仓 2 条专用规则。两个都过才算过。
#
# ── 为什么是「两个 job」而不是一个 ───────────────────────────────────────────
#   本仓历史里**确实**还躺着那两个部署脚本的副本（`9003611` / `4fb5459`），
#   在清史（`git filter-repo`）执行完之前，全历史扫描必然红。
#   如果只有这一个 job，结果是：CI 从今天起长期红 → 大家学会忽略它 →
#   新泄露也看不见。这是「报警器一直响等于没有报警器」。
#   所以拆成两个：
#     · `tree`  —— 必过。扫**当前内容**，是本 PR 的准入条件。它拦得住「以后再提交」。
#     · `history` —— 只在定时/手动跑。它是「历史欠账的进度条」，红了不代表本次改动有问题，
#                 代表清史还没做。清史完成后它会自动变绿，那时再把定时跑改成必过。
#   这两个 job 合起来才既拦得住新泄露、又不会被旧欠账拖成背景噪音。
#
# ── 为什么用官方二进制而不是 gitleaks-action ─────────────────────────────────
#   `gitleaks/gitleaks-action@v2` 对**组织**账号要求 `GITLEAKS_LICENSE`（付费）。
#   本仓是 fork，跑 CI 的是个人账号可能免费、组织账号就会直接失败 —— 一个
#   「因为许可证没配而红」的 job 会被当成噪声。下载官方 release 二进制，
#   版本与校验和都钉死在下面，行为可复现、无许可证依赖、也不需要给 Action 授权。
#
# ── 为什么 gitleaks 而不是 trufflehog / detect-secrets ──────────────────────
#   · 单二进制，无需 Python 环境，也能直接扫历史；
#   · 内置规则认云厂商/平台凭据形状，误报比 trufflehog 的熵扫描低；
#   · `--redact` 让日志里不出现命中的明文（否则 CI 日志本身又成一次泄露）。
#   trufflehog 的「验证型」检测（真发请求确认 key 有效）更适合事后取证，
#   不适合每次 push 都跑。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一 UTC 03:17 —— 历史欠账进度条。
    - cron: '17 3 * * 1'

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.28.0
  # 官方 release 的 linux_x64 包校验和。升级版本时**必须**同步更新这一行，
  # 否则下载会因校验失败而中止 —— 这是故意的，防止「悄悄换了二进制」。
  GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

jobs:
  # ── 必过：扫当前内容 ──────────────────────────────────────────────────────
  tree:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 gitleaks（版本+校验和钉死）
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # 用仓库自带的 `.gitleaks.toml`，**不要**去掉 --config：
      # 实测默认规则对本次事故的两个脚本 0 命中（18 位纯数字 key / IP / root /
      # 私钥路径都不是「云厂商 key 形状」）。配置里有 2 条本仓专用规则。
      - name: 扫工作区
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

  # ── 历史欠账：清史完成后才会绿 ────────────────────────────────────────────
  # 红了先看这条：`git log --oneline -- scripts/deploy-plugin-*.sh`。
  # 只要还有输出，就说明清史（docs/security-incident-20261112.md）没做完。
  history:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 扫全历史：只取最近一次提交的话，历史里已沉淀的凭据
          # （正是本次事故的形态）一个都看不见。
          fetch-depth: 0

      - name: 安装 gitleaks（版本+校验和钉死）
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: 扫完整历史
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
